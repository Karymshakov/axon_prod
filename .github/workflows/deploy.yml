name: Deploy Axon

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            cd /home/Axon_prod/Axon_prod/axon_prod

            git fetch origin
            git reset --hard origin/master

            export PYTHON_IMAGE="${PYTHON_IMAGE:-mirror.gcr.io/library/python:3.12-slim}"
            export NODE_IMAGE="${NODE_IMAGE:-mirror.gcr.io/library/node:20-alpine}"
            export NGINX_IMAGE="${NGINX_IMAGE:-mirror.gcr.io/library/nginx:1.25-alpine}"
            export POSTGRES_IMAGE="${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:17}"
            export REDIS_IMAGE="${REDIS_IMAGE:-mirror.gcr.io/library/redis:7}"

            if ! docker compose pull db redis || ! docker compose build; then
              echo "=== PRIMARY PUBLIC MIRROR FAILED: TRYING AWS PUBLIC ECR ==="
              export PYTHON_IMAGE="public.ecr.aws/docker/library/python:3.12-slim"
              export NODE_IMAGE="public.ecr.aws/docker/library/node:20-alpine"
              export NGINX_IMAGE="public.ecr.aws/docker/library/nginx:1.25-alpine"
              export POSTGRES_IMAGE="public.ecr.aws/docker/library/postgres:17"
              export REDIS_IMAGE="public.ecr.aws/docker/library/redis:7"
              docker compose pull db redis
              docker compose build
            fi

            docker compose up -d --remove-orphans
            docker compose ps
