name: Deploy Axon

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/Axon_prod/Axon_prod/axon_prod

            git fetch origin
            git reset --hard origin/master

            docker compose down
            docker compose up -d --build || {
              echo "===== docker compose ps ====="
              docker compose ps || true

              echo "===== postgres logs ====="
              docker logs axon_postgres --tail 200 || true

              echo "===== backend logs ====="
              docker logs axon_backend --tail 200 || true

              echo "===== frontend logs ====="
              docker logs axon_frontend --tail 100 || true

              exit 1
            }

            docker compose ps
